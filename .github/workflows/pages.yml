# Publishes the site to GitHub Pages on every push to main.
name: Deploy Burhān
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # GitHub lists a fresh artifact with a delay (Nov 2026: "No artifacts named github-pages"), so wait and retry.
      - run: sleep 45
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
